name: Build & Deploy 大模型世界

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 与上游数据同步时点对齐（UTC 01:40 / 13:40）
  schedule:
    - cron: '40 1,13 * * *'

permissions:
  contents: write

concurrency:
  group: pages-deploy-ai-model-world
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WRANGLER_VERSION: "4.42.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Sync upstream data (失败则回落到仓库内快照)
        run: npm run sync
        continue-on-error: true

      - name: Build static export
        run: npm run build

      - name: Verify build output
        run: |
          echo "== 构建产物自检 =="
          du -sh out .next 2>/dev/null || true
          find out -type f 2>/dev/null | wc -l
          test -f out/index.html || { echo "::error::out/index.html 不存在，构建未产出静态文件"; exit 1; }

      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: data snapshot $(date -u +%FT%TZ)"
          git push || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy out --project-name=ai-model-world --branch=main --commit-dirty=false
